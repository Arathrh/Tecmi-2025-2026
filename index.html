<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Estudiantil - Compacto</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --tec-dark-blue: #004b61;
            --tec-teal: #008a96;
            --bg-main: #ffffff;
            --bg-side: #fbfbfb;
            --border-color: #ededed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-main);
            font-size: 14px; /* Tamaño de fuente base más pequeño */
        }

        /* --- Barra Lateral Reducida --- */
        nav {
            width: 210px; /* Reducción de ancho */
            background-color: var(--bg-side);
            display: flex;
            flex-direction: column;
            padding: 15px 0;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .nav-logo {
            width: 140px; /* Logo más pequeño */
            margin: 0 auto 20px auto;
            display: block;
        }

        nav a {
            padding: 10px 20px;
            color: #666;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        nav a:hover { background-color: #f0f4f5; color: var(--tec-teal); }

        nav a.active {
            background-color: #eef7f8;
            color: var(--tec-teal);
            border-left: 3px solid var(--tec-teal);
            font-weight: 600;
        }

        nav i { margin-right: 12px; width: 16px; text-align: center; font-size: 1rem; }

        /* --- Contenedor Principal --- */
        main {
            flex-grow: 1;
            padding: 25px 40px; /* Menos espacio arriba/abajo */
            overflow-y: auto;
        }

        h1 { font-size: 1.4rem; margin-bottom: 20px; }

        section { display: none; }
        section.active { display: block; }

        /* --- Credencial Compacta (Escalada hacia abajo) --- */
        .id-card {
            width: 380px; /* Tamaño reducido de 450px -> 380px */
            height: 235px; /* Proporción ajustada */
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .card-header {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-logo { height: 20px; }

        .tec-logo-text {
            color: var(--tec-dark-blue);
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .card-body {
            display: flex;
            background-color: #fafafa;
            height: 155px;
            margin-top: 10px;
            color: var(--tec-dark-blue);
            position: relative;
            border-top: 1px solid #f0f0f0;
        }

        .photo-space {
            width: 110px; /* Foto más pequeña */
            height: 135px;
            background: #eee;
            margin: -20px 0 0 15px;
            border: 2px solid white;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .photo-space img { width: 100%; height: 100%; object-fit: cover; }

        .student-info { padding: 15px; flex-grow: 1; }

        .student-info h2 {
            margin: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .student-info .id-num {
            margin: 5px 0 2px 0;
            font-size: 0.85rem;
            color: var(--tec-teal);
            font-weight: bold;
        }

        .student-info .level { font-size: 0.75rem; color: #777; }

        .campus-footer {
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 0.65rem;
            color: #bbb;
        }

        /* --- Tabla Compacta --- */
        .schedule-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 800px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #f8f9fa; color: var(--tec-dark-blue); padding: 10px; text-align: left; border-bottom: 2px solid var(--tec-teal); }
        td { padding: 10px; border-bottom: 1px solid #f0f0f0; }

    </style>
</head>
<body>

    <nav>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/65/Universidad_Tecmilenio.png" alt="Tecmilenio" class="nav-logo">
        <a href="#" onclick="showSection('credencial')" class="active" id="link-credencial"><i class="fas fa-id-card"></i> Credencial</a>
        <a href="#" onclick="showSection('horario')" id="link-horario"><i class="fas fa-calendar-alt"></i> Horario</a>
        <a href="#"><i class="fas fa-graduation-cap"></i> Plan</a>
        <a href="#"><i class="fas fa-user-circle"></i> Perfil</a>
    </nav>

    <main>
        <section id="credencial" class="active">
            <h1 style="color: var(--tec-dark-blue);">Mi Credencial</h1>
            <div class="id-card">
                <div class="card-header">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/65/Universidad_Tecmilenio.png" class="mini-logo" alt="Logo">
                    <span class="tec-logo-text">TECMILENIO</span>
                </div>
                <div class="card-body">
                    <div class="photo-space">
                        <img src="https://i.ibb.co/vzYp6mC/profile-linkedin.jpg" alt="Jesus Arath">
                    </div>
                    <div class="student-info">
                        <h2>Jesus Arath<br>Reyna Hernandez</h2>
                        <p class="id-num">AL02762508</p>
                        <p class="level">Posgrado</p>
                    </div>
                    <div class="campus-footer">Campus San Nicolás</div>
                </div>
            </div>
            <p style="color: #999; font-size: 0.75rem; margin-top: 15px;">
                <i class="fas fa-check-circle" style="color: #28a745;"></i> Activo - Ciclo 2026
            </p>
        </section>

        <section id="horario">
            <h1 style="color: var(--tec-dark-blue);">Horario</h1>
            <div class="schedule-card">
                <table>
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Día</th>
                            <th>Hora</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Aprendizaje Profundo</strong></td>
                            <td>Lun/Mié</td>
                            <td>18:30 - 20:30</td>
                        </tr>
                        <tr>
                            <td><strong>Redes Neuronales</strong></td>
                            <td>Mar/Jue</td>
                            <td>18:30 - 20:30</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('link-' + sectionId).classList.add('active');
        }
    </script>
</body>
</html>
